name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check types
      run: npm run typecheck

    - name: Lint
      run: npm run lint

    - name: Run automated tests
      run: npm run test:ci

    - name: Build
      run: npm run build
      env:
        # Safe dummy values for CI build so that we don't need real secrets
        NEXTAUTH_SECRET: 'ci-test-secret-do-not-use'
        AUTH_SECRET: 'ci-test-secret-do-not-use'
        NEXTAUTH_URL: 'http://localhost:3000'
        DATABASE_URL: 'postgresql://fake:fake@localhost:5432/fake'
        DIRECT_URL: 'postgresql://fake:fake@localhost:5432/fake'
